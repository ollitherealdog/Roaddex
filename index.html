async function ask(data,models=MODELS){
 for(const m of models){
  let r;
  try{r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":KEY},body:JSON.stringify({contents:[{parts:[{text:PROMPT()},{inline_data:{mime_type:"image/jpeg",data}}]}],generationConfig:{temperature:.1,responseMimeType:"application/json"}})})}catch(e){throw new Error(t("net"))}
  if(r.status===404)continue;
  if(!r.ok){
   let msg="";try{msg=(await r.json()).error?.message||""}catch(e){}
   if(r.status===429)throw new Error(t("limit"));
   if((r.status===400||r.status===403)&&/api key|API_KEY/i.test(msg))throw new Error(t("badKey"));
   if(r.status>=500)throw new Error(t("busyErr"));
   throw new Error(t("apiErr")+" "+r.status+(msg?": "+msg.slice(0,90):""));
  }
  const j=await r.json(),txt=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("");
  try{return JSON.parse(txt.replace(/```json|```/g,"").trim())}catch(e){throw new Error(t("parse"))}
 }
 throw new Error(t("apiErr")+" 404");
}
